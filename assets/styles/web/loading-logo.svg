<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="120" height="120">
  <!-- NØDE CAD mark, the same geometry as assets/icons/app/shared/source/app_icon.rs: the NØDE
       "Ø" with the ring drawn as a cube's hexagonal outline, cut by the coral bar, on the night
       tile. The bar breathes while the app loads. -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <line x1="11" y1="89" x2="89" y2="11" stroke="#000" stroke-width="21" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0a0e18"/>
  <g transform="translate(262 262) scale(5)">
    <g mask="url(#gap)" fill="none" stroke="#e5e5e5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="50,9 85.507,29.5 85.507,70.5 50,91 14.493,70.5 14.493,29.5" stroke-width="11"/>
      <path d="M50 50 L14.493 29.5 M50 50 L50 91" stroke-width="7"/>
    </g>
    <line x1="11" y1="89" x2="89" y2="11" stroke="#e56e6e" stroke-width="13" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
