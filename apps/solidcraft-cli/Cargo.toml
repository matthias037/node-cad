[package]
name = "solidcraft-cli"
description = "NØDE CAD headless CLI: run command scripts, measure, export, render snapshots, replay oracle recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "node-cad-cli"

[lints]
workspace = true

# The executable is `node-cad-cli`; the package keeps its upstream name so `cargo -p solidcraft-cli` works.
[[bin]]
name = "node-cad-cli"
path = "src/main.rs"

# Compatibility aliases for the CLI's former names (docs/compatibility.md): each forwards to
# node-cad-cli with a deprecation note on stderr, so existing scripts and MCP client setups keep
# working. Shipped in every package for at least one release.
[[bin]]
name = "solidcraft-cli"
path = "src/alias_solidcraft.rs"

[[bin]]
name = "solvecraft-cli"
path = "src/alias_solvecraft.rs"

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-gpu = { workspace = true }
solidcraft-mcp = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Snapshot tests decode the pictures to compare them with a tolerance.
image = { workspace = true }
