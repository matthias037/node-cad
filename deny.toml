# `cargo xtask licences --check` keeps THIRD-PARTY-LICENSES.txt current; `cargo deny check
# licenses` refuses any dependency that is not under a permissive licence.
[licenses]
# Permissive licences only, so the product can be sold and shipped closed-source. Copyleft
# (GPL, LGPL, AGPL, MPL, EUPL, EPL, CDDL, OSL, CC-BY-SA…) is refused by not being listed. A crate
# offered under several licences ("MIT OR GPL-2.0") passes through its permissive option.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    # Fonts bundled by egui (epaint_default_fonts): may ship inside a commercial program; only
    # the fonts themselves stay under these licences.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla's root certificate data (webpki-root-certs).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[advisories]
# The nightly command downgrades only this diagnostic with --warn unmaintained.
unmaintained = "all"
yanked = "warn"
# zip 8.6 comes only through cadmpeg-codec-freecad 0.6.1 (`zip = "^8"`); all three advisories
# are in ZipArchive::extract / ZipStreamReader::extract, which neither it nor solidcraft-io
# calls. Remove these when cadmpeg moves to zip 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8 via cadmpeg-codec-freecad; extract() is never called" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 via cadmpeg-codec-freecad; extract() is never called" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 via cadmpeg-codec-freecad; extract() is never called" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
